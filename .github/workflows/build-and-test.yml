name: Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-and-test:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies (bun)
        working-directory: build/vue-app
        run: bun install --frozen-lockfile

      - name: Create .env.local
        working-directory: build/vue-app
        shell: bash
        run: |
          printf '%s\n' "VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}" > .env.local
          printf '%s\n' "VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}" >> .env.local
          printf '%s\n' "VITE_ADMIN_EMAIL=${{ secrets.VITE_ADMIN_EMAIL }}" >> .env.local

      - name: Build project (bun)
        working-directory: build/vue-app
        run: bun run build

      - name: Verify build output
        shell: bash
        run: |
          set -euo pipefail
          echo "Checking build output in root directory..."

          test -f index.html
          test -d assets
          test -d blog
          test -d project

          echo "✓ index.html found"
          echo "✓ assets directory found ($(find assets -type f | wc -l) files)"
          echo "✓ blog directory found"
          echo "✓ project directory found"

          if [ -d SniShaperWeb ]; then
            echo "✓ SniShaperWeb directory found"
          else
            echo "⚠ SniShaperWeb directory not found (optional)"
          fi

      - name: Check file timestamps
        shell: bash
        run: |
          set -euo pipefail
          echo "index.html: $(stat -c '%y' index.html 2>/dev/null || stat -f '%Sm' index.html)"
          echo "assets directory: $(stat -c '%y' assets 2>/dev/null || stat -f '%Sm' assets)"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build-output-${{ matrix.os }}
          path: |
            index.html
            assets/
            blog/
            project/
            *.html
            *.css
            *.js
            *.png
            *.ico
            *.woff*
            *.ttf
            _redirects
            manifest.json
          retention-days: 7