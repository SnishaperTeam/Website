name: Supabase Keep Alive

on:
  schedule:
    - cron: '30 23 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping all instances
        env:
          SUPABASE_URLS: ${{ secrets.SUPABASE_URLS }}
          SUPABASE_KEYS: ${{ secrets.SUPABASE_KEYS }}
        run: |
          mapfile -t raw_urls < <(echo "$SUPABASE_URLS" | tr -d '\r' | sed '/^[[:space:]]*$/d')
          mapfile -t raw_keys < <(echo "$SUPABASE_KEYS" | tr -d '\r' | sed '/^[[:space:]]*$/d')
          urls=()
          for u in "${raw_urls[@]}"; do
            u_clean=$(echo "$u" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
            urls+=("$u_clean")
          done
          keys=()
          for k in "${raw_keys[@]}"; do
            k_clean=$(echo "$k" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
            keys+=("$k_clean")
          done
          if [ ${#urls[@]} -ne ${#keys[@]} ]; then
            echo "❌ Count mismatch"
            exit 1
          fi
          for i in "${!urls[@]}"; do
            url="${urls[$i]}"
            key="${keys[$i]}"
            project_id=$(echo "$url" | sed -E 's#https?://([^.]*)\.supabase\.co.*#\1#')
            # 请求公开表 health（需确保该表存在且允许匿名读取）
            status=$(curl -s -o /dev/null -w "%{http_code}" \
              "${url}/rest/v1/health?limit=1" \
              -H "apikey: ${key}" \
              -H "Authorization: Bearer ${key}" \
              --connect-timeout 10 \
              --retry 2)
            echo "${project_id}: HTTP ${status}"
            if [ "$status" -ne 200 ]; then
              echo "❌ Failed for ${project_id}"
              exit 1
            fi
          done
          echo "✅ All done"
