name: Weekly Build & Deploy to Cloudflare Pages

on:
  schedule:
    - cron: '0 19 * * 0'          # 每周日 19:00 (UTC) 自动运行
  workflow_dispatch:              # 允许手动触发

permissions:
  contents: read                  # 只需读取代码权限

concurrency:
  group: weekly-deploy
  cancel-in-progress: false       # 不允许取消正在进行的部署

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      # 1. 拉取代码
      - name: Checkout code
        uses: actions/checkout@v5

      # 2. 安装 Bun
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # 3. 安装依赖（在 Vue 项目目录下）
      - name: Install dependencies (bun)
        working-directory: build/vue-app
        run: bun install --frozen-lockfile

      # 4. 创建 .env.local（注入 Supabase 等环境变量）
      - name: Create .env.local
        working-directory: build/vue-app
        run: |
          echo "VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}" > .env.local
          echo "VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}" >> .env.local
          echo "VITE_ADMIN_EMAIL=${{ secrets.VITE_ADMIN_EMAIL }}" >> .env.local

      # 5. 构建 Vue 项目（默认输出到 build/vue-app/dist）
      - name: Build project
        working-directory: build/vue-app
        run: bun run build

      # 6. 验证构建产物是否存在
      - name: Verify build output
        run: |
          if [ -f "build/vue-app/dist/index.html" ]; then
            echo "✅ index.html found"
          else
            echo "❌ index.html missing"
            exit 1
          fi
          if [ -d "build/vue-app/dist/assets" ]; then
            echo "✅ assets directory found"
          else
            echo "❌ assets directory missing"
            exit 1
          fi
          echo "Build output verified"

      # 7. 部署到 Cloudflare Pages
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler@latest pages deploy build/vue-app/dist \
            --project-name=jetcpppages \
            --branch=main \
            --commit-dirty=true
