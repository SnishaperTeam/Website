<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>公告管理 · SnishaperTeam</title>
<style>
  :root {
    --font-mono: 'SimSun', 'Songti SC', 'Noto Serif CJK SC', 'Courier New', monospace;
    --color-bg: #000;
    --color-surface: #0a0a0a;
    --color-border: rgba(255,255,255,0.08);
    --color-border-hover: rgba(255,255,255,0.18);
    --color-text: rgba(255,255,255,0.78);
    --color-text-dim: rgba(255,255,255,0.42);
    --color-text-faint: rgba(255,255,255,0.22);
    --color-white: rgba(255,255,255,0.92);
    --color-glow: rgba(255,255,255,0.06);
    --color-green: rgba(120, 220, 160, 0.7);
    --color-yellow: rgba(240, 200, 100, 0.7);
    --color-blue: rgba(100, 180, 240, 0.7);
    --color-red: rgba(255, 95, 87, 0.7);
    --ease-out-expo: cubic-bezier(0.19, 1, 0.22, 1);
    --ease-smooth: cubic-bezier(0.16, 1, 0.3, 1);
    --radius-sm: 2px;
    --radius-md: 4px;
    --radius-lg: 8px;
    --font-size-base: 18px;
    --font-size-sm: 15px;
    --font-size-xs: 13px;
    --font-size-lg: 26px;
    --font-size-xl: 36px;
    --line-height: 1.6;
    --container-padding: 40px;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html {
    font-size: var(--font-size-base);
    background: var(--color-bg);
    color: var(--color-text);
    font-family: var(--font-mono);
    line-height: var(--line-height);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }
  body { background: var(--color-bg); min-height: 100vh; }
  a { color: var(--color-text); text-decoration: none; transition: color 0.25s var(--ease-out-expo); }
  a:hover { color: var(--color-white); }
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: var(--color-bg); }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 2px; }
  ::selection { background: rgba(255,255,255,0.15); color: var(--color-white); }

  .geek-nav {
    position: sticky; top: 0; z-index: 1000;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 var(--container-padding); height: 56px;
    background: rgba(0,0,0,0.85);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--color-border);
  }
  .geek-nav-brand {
    display: flex; align-items: center; gap: 12px;
    font-weight: 600; font-size: 22px; color: var(--color-white); letter-spacing: 0.04em;
  }
  .geek-nav-actions { display: flex; align-items: center; gap: 8px; }

  main { width: 100%; max-width: 1400px; margin: 0 auto; padding: 0 var(--container-padding) 80px; }

  .page-head { padding: 72px 0 36px; }
  .page-head h1 {
    font-size: var(--font-size-xl); font-weight: 400; letter-spacing: 0.03em;
    color: var(--color-white); line-height: 1.2;
  }
  .page-head .subtitle {
    font-size: var(--font-size-base); color: var(--color-text-dim); margin-top: 12px; max-width: 640px;
  }
  .tag-pill {
    display: inline-block; font-size: var(--font-size-xs); color: var(--color-text-faint);
    border: 1px solid var(--color-border); border-radius: 999px; padding: 3px 12px;
    letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 18px;
  }

  .btn-geek {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 8px 24px;
    font-family: var(--font-mono); font-size: var(--font-size-xs); color: var(--color-white);
    background: rgba(255,255,255,0.08); border: 1px solid var(--color-border);
    border-radius: var(--radius-sm); cursor: pointer; letter-spacing: 0.02em;
    transition: all 0.25s var(--ease-out-expo);
  }
  .btn-geek:hover { background: rgba(255,255,255,0.14); border-color: var(--color-border-hover); box-shadow: 0 0 20px rgba(255,255,255,0.04); }
  .btn-geek.primary { background: rgba(120,220,160,0.14); border-color: rgba(120,220,160,0.3); color: var(--color-green); }
  .btn-geek.primary:hover { background: rgba(120,220,160,0.22); border-color: rgba(120,220,160,0.5); }
  .btn-geek.danger { color: var(--color-red); border-color: rgba(255,95,87,0.25); }
  .btn-geek.danger:hover { background: rgba(255,95,87,0.12); border-color: rgba(255,95,87,0.5); }
  .btn-geek.small { padding: 5px 14px; font-size: 12px; }
  .btn-geek:disabled { opacity: 0.45; cursor: not-allowed; }

  .card-geek {
    position: relative;
    background: rgba(255,255,255,0.02);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-md);
    padding: 28px;
    overflow: hidden;
    transition: border-color 0.4s var(--ease-out-expo), background 0.4s var(--ease-out-expo);
  }
  .card-geek:hover { border-color: rgba(255,255,255,0.15); background: rgba(255,255,255,0.04); }

  .term-block { border: 1px solid var(--color-border); border-radius: var(--radius-md); overflow: hidden; font-size: var(--font-size-xs); }
  .term-bar {
    display: flex; align-items: center; gap: 8px; padding: 10px 16px;
    background: rgba(255,255,255,0.03); border-bottom: 1px solid var(--color-border);
    font-size: var(--font-size-xs); color: var(--color-text-dim);
  }
  .term-dot { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,0.1); }
  .term-dot:nth-child(1) { background: #ff5f57; }
  .term-dot:nth-child(2) { background: #ffbd2e; }
  .term-dot:nth-child(3) { background: #28c840; }
  .term-body { padding: 18px 22px; background: rgba(255,255,255,0.015); }

  .badge-geek {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: var(--font-size-xs); padding: 2px 10px;
    border: 1px solid var(--color-border); border-radius: var(--radius-sm);
    color: var(--color-text-dim); letter-spacing: 0.04em;
  }
  .badge-geek.green { border-color: rgba(120,220,160,0.2); color: var(--color-green); }
  .badge-geek.yellow { border-color: rgba(240,200,100,0.2); color: var(--color-yellow); }
  .badge-geek.red { border-color: rgba(255,95,87,0.2); color: var(--color-red); }
  .badge-geek.blue { border-color: rgba(100,180,240,0.2); color: var(--color-blue); }

  label {
    display: block; font-size: var(--font-size-xs); color: var(--color-text-dim);
    letter-spacing: 0.06em; margin: 16px 0 7px;
  }
  input, textarea, select {
    width: 100%;
    font-family: var(--font-mono); font-size: var(--font-size-xs); color: var(--color-white);
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--color-border); border-radius: var(--radius-sm);
    padding: 10px 12px; outline: none;
    transition: border-color 0.25s var(--ease-out-expo), background 0.25s var(--ease-out-expo);
  }
  input:focus, textarea:focus, select:focus {
    border-color: var(--color-border-hover); background: rgba(255,255,255,0.06);
  }
  textarea { resize: vertical; min-height: 96px; line-height: 1.7; }
  select option { background: var(--color-surface); color: var(--color-text); }

  .grid { display: grid; grid-template-columns: minmax(340px, 0.85fr) 1.15fr; gap: 24px; align-items: start; }
  @media (max-width: 980px) {
    .grid { grid-template-columns: 1fr; }
    main { padding: 0 24px 64px; }
    .geek-nav { padding: 0 24px; }
  }

  .row { display: flex; gap: 14px; }
  .row > div { flex: 1; }
  .actions { display: flex; gap: 12px; margin-top: 24px; flex-wrap: wrap; }
  .panel-head {
    display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap;
    margin-bottom: 6px;
  }
  .panel-head h2 {
    font-size: var(--font-size-sm); font-weight: 400; letter-spacing: 0.08em;
    color: var(--color-white); text-transform: uppercase;
  }
  .status { font-size: var(--font-size-xs); color: var(--color-text-faint); }

  .list { display: flex; flex-direction: column; gap: 12px; margin-top: 16px; max-height: 66vh; overflow-y: auto; padding-right: 4px; }
  .item {
    border: 1px solid var(--color-border); border-left: 2px solid var(--color-border);
    border-radius: var(--radius-sm);
    padding: 14px 16px;
    background: rgba(255,255,255,0.015);
    transition: border-color 0.3s var(--ease-out-expo), background 0.3s var(--ease-out-expo);
  }
  .item:hover { background: rgba(255,255,255,0.04); border-color: var(--color-border-hover); }
  .item.critical { border-left-color: var(--color-red); }
  .item.important { border-left-color: var(--color-yellow); }
  .item.info { border-left-color: var(--color-blue); }
  .item-top { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
  .item-title { font-weight: 600; font-size: var(--font-size-sm); color: var(--color-white); }
  .item-meta { font-size: var(--font-size-xs); color: var(--color-text-faint); white-space: nowrap; }
  .item-body {
    color: var(--color-text-dim); font-size: var(--font-size-xs); margin-top: 8px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .item-foot { display: flex; gap: 8px; margin-top: 12px; align-items: center; flex-wrap: wrap; }
  .spacer { flex: 1; }
  .empty { color: var(--color-text-faint); font-size: var(--font-size-xs); padding: 36px 0; text-align: center; }

  .auth-wrap {
    min-height: calc(100vh - 56px - 120px);
    display: flex; align-items: center; justify-content: center; padding: 40px 0;
  }
  .auth-card { width: 100%; max-width: 460px; }
  .auth-title {
    font-size: var(--font-size-lg); font-weight: 400; color: var(--color-white);
    letter-spacing: 0.04em; margin-bottom: 6px;
  }
  .auth-sub { font-size: var(--font-size-xs); color: var(--color-text-faint); margin-bottom: 8px; }
  .auth-line { color: var(--color-green); font-size: var(--font-size-xs); margin-bottom: 14px; }
  .auth-line::before { content: '$ '; }
  .auth-actions { display: flex; gap: 10px; margin-top: 22px; }

  #toast {
    position: fixed; left: 50%; bottom: 28px; transform: translate(-50%, 14px);
    background: rgba(10,10,10,0.96); border: 1px solid var(--color-border);
    border-radius: var(--radius-sm); padding: 10px 20px;
    font-size: var(--font-size-xs); opacity: 0; pointer-events: none;
    transition: opacity 0.22s ease, transform 0.32s var(--ease-out-expo);
    box-shadow: 0 20px 50px -24px #000; z-index: 50;
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
  #toast.err { border-color: rgba(255,95,87,0.35); color: var(--color-red); }
  #toast.ok { border-color: rgba(120,220,160,0.35); color: var(--color-green); }

  .geek-footer {
    border-top: 1px solid var(--color-border);
    padding: 28px var(--container-padding);
    font-size: var(--font-size-xs); color: var(--color-text-faint);
    display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  }
  .text-faint { color: var(--color-text-faint); }
  .hidden { display: none !important; }
</style>
</head>
<body>
<nav class="geek-nav">
  <a class="geek-nav-brand" href="/"><span>&#x25a0;</span> SnishaperTeam</a>
  <div class="geek-nav-actions">
    <a class="btn-geek small" href="/">[首页]</a>
    <button class="btn-geek small hidden" id="logoutBtn">[登出]</button>
  </div>
</nav>

<main>
  <div id="loginView" class="auth-wrap hidden">
    <div class="auth-card">
      <div class="term-block">
        <div class="term-bar">
          <span class="term-dot"></span><span class="term-dot"></span><span class="term-dot"></span>
          <span>admin@snishaper &mdash; auth</span>
        </div>
        <div class="term-body">
          <div class="auth-line">notice-admin login</div>
          <div class="auth-title">公告管理 · 身份验证</div>
          <div class="auth-sub">请先验证管理员邮箱与密码，验证通过后进入公告管理。</div>
          <label for="email">邮箱 / EMAIL</label>
          <input id="email" type="email" autocomplete="username" placeholder="admin@example.com" />
          <label for="password">密码 / PASSWORD</label>
          <input id="password" type="password" autocomplete="current-password" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;" />
          <div class="auth-actions">
            <button class="btn-geek primary" id="loginBtn">[登录]</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="adminView" class="hidden">
    <div class="page-head">
      <div class="tag-pill">notice-center / admin</div>
      <h1>公告管理</h1>
      <div class="subtitle">发布后经 <span class="text-faint">/api/notices</span> 立即对外提供服务，客户端主页自动拉取并缓存。</div>
    </div>

    <div class="grid">
      <section class="card-geek">
        <div class="panel-head">
          <h2 id="formTitle">新建公告</h2>
          <div class="status" id="status">未加载</div>
        </div>
        <label for="title">标题（中文，必填）</label>
        <input id="title" placeholder="例如：1.30.0 版本发布" />
        <label for="title_en">标题（English）</label>
        <input id="title_en" />
        <label for="title_ru">标题（Русский）</label>
        <input id="title_ru" />
        <label for="body">正文（中文，必填）</label>
        <textarea id="body"></textarea>
        <label for="body_en">正文（English）</label>
        <textarea id="body_en"></textarea>
        <label for="body_ru">正文（Русский）</label>
        <textarea id="body_ru"></textarea>
        <div class="row">
          <div>
            <label for="level">级别</label>
            <select id="level">
              <option value="info">info 普通</option>
              <option value="important">important 重要</option>
              <option value="critical">critical 紧急</option>
            </select>
          </div>
          <div>
            <label for="pinned">置顶</label>
            <select id="pinned">
              <option value="false">否</option>
              <option value="true">是</option>
            </select>
          </div>
        </div>
        <div class="row">
          <div>
            <label for="published_at">发布时间</label>
            <input id="published_at" type="datetime-local" />
          </div>
          <div>
            <label for="expires_at">过期时间（可空）</label>
            <input id="expires_at" type="datetime-local" />
          </div>
        </div>
        <div class="row">
          <div>
            <label for="link">外链（可空）</label>
            <input id="link" placeholder="https://" />
          </div>
          <div>
            <label for="link_text">外链文字</label>
            <input id="link_text" placeholder="查看详情" />
          </div>
        </div>
        <div class="actions">
          <button class="btn-geek primary" id="submit">发布</button>
          <button class="btn-geek" id="reset">清空表单</button>
        </div>
        <div class="status" style="margin-top: 14px;">正文支持换行，客户端按段落渲染；英文、俄文留空时回退中文。</div>
      </section>

      <section class="card-geek">
        <div class="panel-head">
          <h2>全部公告</h2>
          <button class="btn-geek small" id="reload">[刷新]</button>
        </div>
        <div class="status" id="listStatus">加载中…</div>
        <div class="list" id="list"></div>
      </section>
    </div>
  </div>
</main>

<footer class="geek-footer">
  <span><span class="text-faint">// 2026</span> SnishaperTeam &mdash; 代码重塑世界</span>
  <span><a href="/">首页</a> &nbsp; <a href="https://github.com/dongzheyu" target="_blank" class="text-faint">Github</a></span>
</footer>

<div id="toast"></div>
<script>
  const api = new URL('/api/notices', location.origin).toString()
  const authApi = new URL('/api/notices/auth', location.origin).toString()
  const SESSION_KEY = 'snishaper_notice_session'
  const el = (id) => document.getElementById(id)
  const fields = ['title', 'title_en', 'title_ru', 'body', 'body_en', 'body_ru', 'level', 'pinned', 'published_at', 'expires_at', 'link', 'link_text']
  let editing = null
  let notices_all = []

  function loadSession() {
    try {
      const raw = localStorage.getItem(SESSION_KEY)
      if (!raw) return null
      const session = JSON.parse(raw)
      if (!session || !session.token) return null
      if (session.expires_at && new Date(session.expires_at).getTime() <= Date.now()) return null
      return session
    } catch {
      return null
    }
  }

  function saveSession(session) {
    localStorage.setItem(SESSION_KEY, JSON.stringify(session))
  }

  function clearSession() {
    localStorage.removeItem(SESSION_KEY)
  }

  function authHeaders(extra) {
    const session = loadSession()
    const headers = Object.assign({ 'Content-Type': 'application/json' }, extra || {})
    if (session && session.token) headers.Authorization = 'Bearer ' + session.token
    return headers
  }

  function toast(message, kind) {
    const node = el('toast')
    node.textContent = message
    node.className = 'show ' + (kind || '')
    clearTimeout(node._timer)
    node._timer = setTimeout(() => { node.className = '' }, 3200)
  }

  function showLogin() {
    el('loginView').classList.remove('hidden')
    el('adminView').classList.add('hidden')
    el('logoutBtn').classList.add('hidden')
  }

  function showAdmin() {
    el('loginView').classList.add('hidden')
    el('adminView').classList.remove('hidden')
    el('logoutBtn').classList.remove('hidden')
  }

  async function handleAuthError(response) {
    if (response.status === 401) {
      clearSession()
      showLogin()
      toast('登录已过期，请重新验证', 'err')
      return true
    }
    return false
  }

  function toLocalInput(iso) {
    if (!iso) return ''
    const date = new Date(iso)
    if (Number.isNaN(date.getTime())) return ''
    const pad = (n) => String(n).padStart(2, '0')
    return date.getFullYear() + '-' + pad(date.getMonth() + 1) + '-' + pad(date.getDate()) + 'T' + pad(date.getHours()) + ':' + pad(date.getMinutes())
  }

  function toISO(value) {
    if (!value) return ''
    const date = new Date(value)
    if (Number.isNaN(date.getTime())) return ''
    return date.toISOString()
  }

  function formatTime(iso) {
    if (!iso) return '—'
    const date = new Date(iso)
    if (Number.isNaN(date.getTime())) return iso
    return date.toLocaleString('zh-CN', { hour12: false })
  }

  function readForm() {
    const payload = {}
    for (const key of fields) {
      const raw = el(key).value
      if (key === 'pinned') payload.pinned = raw === 'true'
      else if (key === 'published_at' || key === 'expires_at') payload[key] = toISO(raw)
      else payload[key] = raw.trim()
    }
    return payload
  }

  function fillForm(notice) {
    editing = notice ? notice.id : null
    el('formTitle').textContent = notice ? '编辑公告 · ' + notice.id : '新建公告'
    el('submit').textContent = notice ? '保存修改' : '发布'
    el('title').value = notice ? (notice.title || '') : ''
    el('title_en').value = notice ? (notice.title_en || '') : ''
    el('title_ru').value = notice ? (notice.title_ru || '') : ''
    el('body').value = notice ? (notice.body || '') : ''
    el('body_en').value = notice ? (notice.body_en || '') : ''
    el('body_ru').value = notice ? (notice.body_ru || '') : ''
    el('level').value = notice ? (notice.level || 'info') : 'info'
    el('pinned').value = notice && notice.pinned ? 'true' : 'false'
    el('published_at').value = toLocalInput(notice ? (notice.published_at || new Date().toISOString()) : new Date().toISOString())
    el('expires_at').value = notice ? toLocalInput(notice.expires_at || '') : ''
    el('link').value = notice ? (notice.link || '') : ''
    el('link_text').value = notice ? (notice.link_text || '') : ''
  }

  function render() {
    const host = el('list')
    host.innerHTML = ''
    if (!notices_all.length) {
      host.innerHTML = '<div class="empty">还没有公告</div>'
      return
    }
    const now = Date.now()
    for (const notice of notices_all) {
      const card = document.createElement('div')
      card.className = 'item ' + (notice.level || 'info')
      const expired = notice.expires_at && new Date(notice.expires_at).getTime() <= now
      card.innerHTML =
        '<div class="item-top"><div class="item-title"></div><div class="item-meta">' + formatTime(notice.published_at) + '</div></div>' +
        '<div class="item-body"></div>' +
        '<div class="item-foot">' +
          '<span class="badge-geek ' + (notice.level === 'critical' ? 'red' : notice.level === 'important' ? 'yellow' : 'blue') + '">' + (notice.level || 'info') + '</span>' +
          (notice.pinned ? '<span class="badge-geek green">置顶</span>' : '') +
          (expired ? '<span class="badge-geek red">已过期</span>' : '') +
          '<span class="spacer"></span>' +
          '<button class="btn-geek small" data-act="edit">[编辑]</button>' +
          '<button class="btn-geek small danger" data-act="delete">[删除]</button>' +
        '</div>'
      card.querySelector('.item-title').textContent = notice.title || '(无标题)'
      card.querySelector('.item-body').textContent = notice.body || ''
      card.querySelector('[data-act="edit"]').addEventListener('click', () => {
        fillForm(notice)
        window.scrollTo({ top: 0, behavior: 'smooth' })
      })
      card.querySelector('[data-act="delete"]').addEventListener('click', () => removeNotice(notice))
      host.appendChild(card)
    }
  }

  async function login() {
    const email = el('email').value.trim()
    const password = el('password').value
    if (!email || !password) {
      toast('请输入邮箱与密码', 'err')
      return
    }
    el('loginBtn').disabled = true
    try {
      const response = await fetch(authApi, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password }),
      })
      const data = await response.json()
      if (!response.ok || !data.ok) {
        if (response.status === 429) toast('尝试次数过多，请 ' + (data.retry_after || 60) + ' 秒后再试', 'err')
        else if (response.status === 503) toast('管理端未配置凭据', 'err')
        else toast('邮箱或密码错误', 'err')
        return
      }
      saveSession({ token: data.token, expires_at: data.expires_at })
      el('password').value = ''
      showAdmin()
      toast('验证通过', 'ok')
      await load()
    } catch (error) {
      toast('登录失败：' + error.message, 'err')
    } finally {
      el('loginBtn').disabled = false
    }
  }

  async function load() {
    el('listStatus').textContent = '加载中…'
    try {
      const response = await fetch(api + '?all=1&fresh=1')
      const data = await response.json()
      if (!data.ok) throw new Error(data.error || 'load failed')
      notices_all = data.notices || []
      el('listStatus').textContent = '共 ' + notices_all.length + ' 条 · 版本 v' + data.version + ' · 来源 ' + data.source
      el('status').textContent = '数据版本 v' + data.version + ' · 更新于 ' + formatTime(data.updated_at)
      render()
    } catch (error) {
      el('listStatus').textContent = '加载失败：' + error.message
      toast('加载失败：' + error.message, 'err')
    }
  }

  async function submit() {
    const payload = readForm()
    if (!payload.title || !payload.body) {
      toast('标题与正文必填', 'err')
      return
    }
    if (!payload.published_at) payload.published_at = new Date().toISOString()
    try {
      const isEdit = Boolean(editing)
      const url = isEdit ? api + '/' + encodeURIComponent(editing) : api
      const response = await fetch(url, {
        method: isEdit ? 'PATCH' : 'POST',
        headers: authHeaders(),
        body: JSON.stringify(payload),
      })
      if (await handleAuthError(response)) return
      const data = await response.json()
      if (!response.ok || !data.ok) throw new Error(data.error || 'HTTP ' + response.status)
      toast(isEdit ? '已保存' : '已发布', 'ok')
      fillForm(null)
      await load()
    } catch (error) {
      toast('提交失败：' + error.message, 'err')
    }
  }

  async function removeNotice(notice) {
    if (!confirm('删除公告「' + (notice.title || notice.id) + '」？')) return
    try {
      const response = await fetch(api + '/' + encodeURIComponent(notice.id), {
        method: 'DELETE',
        headers: authHeaders(),
      })
      if (await handleAuthError(response)) return
      const data = await response.json()
      if (!response.ok || !data.ok) throw new Error(data.error || 'HTTP ' + response.status)
      toast('已删除', 'ok')
      if (editing === notice.id) fillForm(null)
      await load()
    } catch (error) {
      toast('删除失败：' + error.message, 'err')
    }
  }

  el('loginBtn').addEventListener('click', login)
  el('password').addEventListener('keydown', (event) => {
    if (event.key === 'Enter') login()
  })
  el('logoutBtn').addEventListener('click', () => {
    clearSession()
    showLogin()
    toast('已登出', 'ok')
  })
  el('reload').addEventListener('click', load)
  el('submit').addEventListener('click', submit)
  el('reset').addEventListener('click', () => fillForm(null))

  fillForm(null)
  if (loadSession()) {
    showAdmin()
    load()
  } else {
    showLogin()
  }
</script>
</body>
</html>
